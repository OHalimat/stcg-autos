<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>STCG Admin</title>
<style>
:root{--bg:#efece6;--card:#fff;--ink:#111110;--mut:#6f6a60;--tan:#a07a4a;--tan2:#c9a56e;--line:#ded9cf;--dark:#141311;--ok:#2f7d4f;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.top{background:var(--dark);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.14em;font-size:14px}.logo i{font-style:normal;color:var(--tan2)}
.sp{flex:1}
.top a,.top button{font-size:13px;color:#d9d3c6;text-decoration:underline}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;white-space:nowrap}
.pill.lt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pill.ok{background:var(--ok)}.pill.bad{background:var(--card);color:var(--bad);border:1px solid #e6b8b4}
.pill[disabled]{opacity:.5;pointer-events:none}
h1{font-size:24px;letter-spacing:-.02em;margin:22px 0 4px}
.note{color:var(--mut);font-size:13px;margin:0}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(40,30,10,.08)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.err{color:var(--bad);font-size:13px;margin:8px 0 0}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 16px}
.car{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(40,30,10,.06)}
.car.sold{opacity:.85;background:#f6f3ee}
.hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hd b{font-size:17px}.hd small{display:block;color:var(--mut)}
.st{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#e3f1e8;color:var(--ok)}
.sold .st{background:#f3dedc;color:var(--bad)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:14px 0}
.pt{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#e6e1d7}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt .x{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:15px;line-height:1}
.pt .cv{position:absolute;left:5px;bottom:5px;border-radius:999px;background:rgba(255,255,255,.92);font-size:11px;font-weight:700;padding:3px 9px}
.pt .cv.is{background:var(--tan2);pointer-events:none}
.none{grid-column:1/-1;color:var(--mut);font-size:13px;padding:10px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.up{position:relative;overflow:hidden}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ov{position:fixed;inset:0;background:rgba(10,8,5,.55);z-index:50;overflow:auto;padding:16px}
.modal{background:var(--bg);border-radius:22px;max-width:560px;margin:3vh auto;padding:22px}
.modal h2{margin:0 0 14px;font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;z-index:99;max-width:92vw;text-align:center}
.toast.bad{background:var(--bad)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:90;display:grid;place-items:center;font-weight:600;text-align:center;padding:20px}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="login" id="lf">
    <div class="logo" style="font-weight:800;letter-spacing:.14em">STCG <i style="font-style:normal;color:var(--tan)">AUTOS</i></div>
    <h1 style="margin-top:8px">Owner login</h1>
    <p class="note" style="margin-bottom:16px">Sign in to manage the cars on your website.</p>
    <div class="fld"><label>Email</label><input name="e" type="email" autocomplete="username" required></div>
    <div class="fld"><label>Password</label><input name="p" type="password" autocomplete="current-password" required></div>
    <button class="pill" style="width:100%;margin-top:6px" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<section id="dash" hidden>
  <div class="top"><div class="wrap"><span class="logo">STCG <i>AUTOS</i> · ADMIN</span><span class="sp"></span><a href="index.html" target="_blank" rel="noopener">View site</a><button id="out">Sign out</button></div></div>
  <div class="wrap">
    <h1>Your cars</h1>
    <p class="note">Changes show on the website straight away. Sold cars disappear from the site but stay here.</p>
    <div class="bar"><span class="note" id="count"></span><button class="pill" id="add">+ Add a new car</button></div>
    <div id="list"></div>
  </div>
</section>

<div class="ov" id="ov" hidden>
  <form class="modal" id="mf" novalidate>
    <h2 id="mt">Car details</h2>
    <div class="row2"><div class="fld"><label>Brand</label><input name="brand" required placeholder="Lexus"></div><div class="fld"><label>Model</label><input name="model" required placeholder="IS 250"></div></div>
    <div class="row2"><div class="fld"><label>Year</label><input name="year" inputmode="numeric" required placeholder="2015"></div><div class="fld"><label>Price (₦)</label><input name="price" inputmode="numeric" required placeholder="12900000"></div></div>
    <div class="row2"><div class="fld"><label>Condition</label><select name="cond"><option>Foreign used</option><option>Nigerian used</option><option>Brand new</option></select></div><div class="fld"><label>Body type</label><select name="body"><option>Sedan</option><option>SUV</option><option>Coupe</option></select></div></div>
    <div class="row2"><div class="fld"><label>Colour</label><select name="color"><option>Black</option><option>White</option><option>Silver</option><option>Grey</option><option>Blue</option><option>Red</option><option>Green</option><option>Brown</option></select></div><div class="fld"><label>Fuel</label><select name="fuel"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Electric</option></select></div></div>
    <div class="row2"><div class="fld"><label>Engine (optional)</label><input name="eng" placeholder="2.5L V6"></div><div class="fld"><label>Transmission (optional)</label><input name="tr" placeholder="Automatic"></div></div>
    <div class="row2"><div class="fld"><label>Mileage (optional)</label><input name="mileage" placeholder="183,416 mi"></div><div class="fld"><label>Seats</label><input name="seats" inputmode="numeric" placeholder="5"></div></div>
    <div class="row2"><div class="fld"><label>Location</label><input name="loc" placeholder="Lagos"></div><div class="fld"><label>Label on photo</label><input name="tag" placeholder="Just arrived"></div></div>
    <div class="fld"><label>Features (separate with commas)</label><textarea name="feats" placeholder="Sunroof, Black interior, Android screen"></textarea></div>
    <div class="err" id="merr"></div>
    <div class="acts" style="margin-top:12px"><button class="pill" type="submit" id="msave">Save</button><button class="pill lt" type="button" id="mcancel">Cancel</button></div>
  </form>
</div>

<div class="busy" id="busy" hidden><div id="busyt">Working…</div></div>

<script>
(function(){
var SB="https://xwlgbikpjcyunjpbeskg.supabase.co",KEY="sb_publishable_MxQcikswi4qMGQiF60gbiw_94ZjIcIQ",BUCKET="car-photos";
var PUB=SB+"/storage/v1/object/public/"+BUCKET+"/";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fmt=function(n){return "₦"+Math.round(Number(n)||0).toLocaleString("en-US")};
var cars=[],editing=null,SES=null;
try{SES=JSON.parse(localStorage.getItem("stcg_admin")||"null")}catch(e){}

function saveSes(s){SES=s;try{s?localStorage.setItem("stcg_admin",JSON.stringify(s)):localStorage.removeItem("stcg_admin")}catch(e){}}
function toast(t,bad){var d=document.createElement("div");d.className="toast"+(bad?" bad":"");d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},bad?5000:2400)}
function busy(t){$("#busy").hidden=!t;if(t)$("#busyt").textContent=t}
function errMsg(e){return (e&&e.message)||"Something went wrong"}

async function refresh(){
  if(!SES||!SES.refresh_token)return false;
  try{
    var r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SES.refresh_token})});
    if(!r.ok){saveSes(null);return false}
    var j=await r.json();saveSes(j);return true;
  }catch(e){return false}
}
async function api(path,opt){
  opt=opt||{};
  if(SES&&SES.expires_at&&SES.expires_at-Date.now()/1000<90)await refresh();
  if(!SES)throw new Error("Please sign in again");
  var h=Object.assign({apikey:KEY,Authorization:"Bearer "+SES.access_token},opt.headers||{});
  var r=await fetch(SB+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&await refresh()){h.Authorization="Bearer "+SES.access_token;r=await fetch(SB+path,Object.assign({},opt,{headers:h}))}
  if(!r.ok){var m="";try{var j=await r.json();m=j.message||j.error||""}catch(e){}throw new Error(m||("Error "+r.status))}
  return r;
}
var JSONH={"Content-Type":"application/json"};

async function load(){
  var r=await api("/rest/v1/cars?select=*&order=sort_order.asc,created_at.desc");
  cars=await r.json();render();
}
function patch(id,body){return api("/rest/v1/cars?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({Prefer:"return=minimal"},JSONH),body:JSON.stringify(body)})}
function byId(id){return cars.filter(function(c){return c.id===id})[0]}
function storagePath(u){return u&&u.indexOf(PUB)===0?u.slice(PUB.length):null}

function render(){
  $("#count").textContent=cars.length+(cars.length===1?" car":" cars")+" · "+cars.filter(function(c){return c.status==="available"}).length+" on the website";
  $("#list").innerHTML=cars.length?cars.map(card).join(""):'<div class="car"><b>No cars yet</b><p class="note">Tap "Add a new car" to list your first one.</p></div>';
}
function card(c){
  var ph=(c.photos||[]).map(function(u,i){return '<div class="pt"><img src="'+esc(u)+'" alt="" loading="lazy"><button class="x" data-a="delph" data-id="'+esc(c.id)+'" data-i="'+i+'" aria-label="Delete photo">✕</button>'+(i===0?'<span class="cv is">Cover</span>':'<button class="cv" data-a="cover" data-id="'+esc(c.id)+'" data-i="'+i+'">Make cover</button>')+'</div>'}).join("");
  var sold=c.status==="sold";
  return '<article class="car'+(sold?" sold":"")+'"><div class="hd"><div><b>'+esc(c.year+" "+c.brand+" "+c.model)+'</b><small>'+fmt(c.price)+' · '+esc(c.cond)+'</small></div><span class="st">'+(sold?"Sold · hidden":"On website")+'</span></div>'+
  '<div class="ph">'+(ph||'<div class="none">No photos yet. Tap "Add photos".</div>')+'</div>'+
  '<div class="acts"><label class="pill up">+ Add photos<input type="file" accept="image/*" multiple data-up="'+esc(c.id)+'"></label><button class="pill lt" data-a="edit" data-id="'+esc(c.id)+'">Edit details</button>'+
  '<button class="pill '+(sold?"ok":"lt")+'" data-a="status" data-id="'+esc(c.id)+'">'+(sold?"Put back on website":"Mark as sold")+'</button><button class="pill bad" data-a="delcar" data-id="'+esc(c.id)+'">Delete car</button></div></article>';
}

document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var c=byId(t.dataset.id),a=t.dataset.a;
  try{
    if(a==="edit"&&c)openForm(c);
    else if(a==="cover"&&c){var ph=c.photos.slice(),i=+t.dataset.i,p=ph.splice(i,1)[0];ph.unshift(p);busy("Saving…");await patch(c.id,{photos:ph});c.photos=ph;render();toast("Cover photo changed")}
    else if(a==="delph"&&c){
      if(!confirm("Delete this photo?"))return;
      var ph2=c.photos.slice(),u=ph2.splice(+t.dataset.i,1)[0];busy("Deleting photo…");
      await patch(c.id,{photos:ph2});c.photos=ph2;
      var sp=storagePath(u);if(sp){try{await api("/storage/v1/object/"+BUCKET+"/"+sp,{method:"DELETE"})}catch(x){}}
      render();toast("Photo deleted");
    }
    else if(a==="status"&&c){var ns=c.status==="sold"?"available":"sold";busy("Saving…");await patch(c.id,{status:ns});c.status=ns;render();toast(ns==="sold"?"Marked as sold. Hidden from the website":"Back on the website")}
    else if(a==="delcar"&&c){
      if(!confirm("Delete the "+c.year+" "+c.brand+" "+c.model+" and all its photos? This cannot be undone.\n\nTip: if it was sold, use 'Mark as sold' instead."))return;
      busy("Deleting car…");
      await api("/rest/v1/cars?id=eq."+encodeURIComponent(c.id),{method:"DELETE"});
      for(var k=0;k<(c.photos||[]).length;k++){var q=storagePath(c.photos[k]);if(q){try{await api("/storage/v1/object/"+BUCKET+"/"+q,{method:"DELETE"})}catch(x){}}}
      cars=cars.filter(function(x){return x.id!==c.id});render();toast("Car deleted");
    }
  }catch(x){toast(errMsg(x),true)}finally{busy(false)}
});

function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var m=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,m/Math.max(w,h)),cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
      cv.toBlob(function(b){b?res(b):rej(new Error("Could not process "+file.name))},"image/jpeg",.82);
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("Could not read "+(file.name||"that photo")))};
    img.src=u;
  });
}
document.addEventListener("change",async function(e){
  var inp=e.target;if(!inp.dataset||!inp.dataset.up)return;
  var c=byId(inp.dataset.up),files=Array.prototype.slice.call(inp.files||[]);inp.value="";
  if(!c||!files.length)return;
  var urls=[],fail=0;
  try{
    for(var i=0;i<files.length;i++){
      busy("Uploading photo "+(i+1)+" of "+files.length+"…");
      try{
        var blob=await shrink(files[i]),path=c.id+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+".jpg";
        await api("/storage/v1/object/"+BUCKET+"/"+path,{method:"POST",headers:{"Content-Type":"image/jpeg","x-upsert":"false"},body:blob});
        urls.push(PUB+path);
      }catch(x){fail++;toast(errMsg(x),true)}
    }
    if(urls.length){busy("Saving…");var all=(c.photos||[]).concat(urls);await patch(c.id,{photos:all});c.photos=all;render();toast(urls.length+(urls.length===1?" photo":" photos")+" added"+(fail?" ("+fail+" failed)":""))}
  }catch(x){toast(errMsg(x),true)}finally{busy(false)}
});

function openForm(c){
  editing=c||null;var f=$("#mf");f.reset();$("#merr").textContent="";
  $("#mt").textContent=c?"Edit car details":"Add a new car";
  var set=function(n,v){if(f.elements[n])f.elements[n].value=v==null?"":v};
  if(c){["brand","model","year","price","cond","body","color","fuel","eng","tr","mileage","seats","loc","tag"].forEach(function(n){set(n,c[n])});set("feats",(c.feats||[]).join(", "))}
  else{set("loc","Lagos");set("tag","Just arrived");set("seats","5")}
  ["cond","body","color","fuel"].forEach(function(n){var el=f.elements[n],v=c?c[n]:null;if(v&&![].some.call(el.options,function(o){return o.value===v})){var o=document.createElement("option");o.textContent=v;el.appendChild(o);el.value=v}});
  $("#ov").hidden=false;
}
$("#add").onclick=function(){openForm(null)};
$("#mcancel").onclick=function(){$("#ov").hidden=true};
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
$("#mf").addEventListener("submit",async function(e){
  e.preventDefault();var f=e.target,v=function(n){return f.elements[n].value.trim()},err=$("#merr");
  var year=parseInt(v("year"),10),price=parseInt(v("price").replace(/\D/g,""),10);
  if(!v("brand")||!v("model")){err.textContent="Please enter the brand and model.";return}
  if(!(year>1950&&year<2100)){err.textContent="Please enter a valid year, like 2015.";return}
  if(!(price>0)){err.textContent="Please enter the price in numbers, like 12900000.";return}
  var row={brand:v("brand"),model:v("model"),year:year,price:price,cond:v("cond"),body:v("body"),color:v("color"),fuel:v("fuel"),eng:v("eng")||null,tr:v("tr")||null,mileage:v("mileage")||null,seats:parseInt(v("seats"),10)||5,loc:v("loc")||"Lagos",tag:v("tag"),feats:v("feats").split(",").map(function(x){return x.trim()}).filter(Boolean)};
  busy("Saving…");
  try{
    if(editing){await patch(editing.id,row);Object.assign(editing,row)}
    else{
      row.id=(slug(year+"-"+row.brand+"-"+row.model)||"car")+"-"+Math.random().toString(36).slice(2,6);
      row.photos=[];row.status="available";
      var first=cars.reduce(function(m,c){return Math.min(m,c.sort_order||0)},0);row.sort_order=first-1;
      var r=await api("/rest/v1/cars",{method:"POST",headers:Object.assign({Prefer:"return=representation"},JSONH),body:JSON.stringify(row)});
      var j=await r.json();cars.unshift(j[0]||row);
    }
    $("#ov").hidden=true;render();toast(editing?"Saved":"Car added. Now add its photos");
  }catch(x){err.textContent=errMsg(x)}finally{busy(false)}
});

function show(authed){$("#login").hidden=authed;$("#dash").hidden=!authed}
$("#lf").addEventListener("submit",async function(e){
  e.preventDefault();var f=e.target,er=$("#lerr");er.textContent="";busy("Signing in…");
  try{
    var r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:f.elements.e.value.trim(),password:f.elements.p.value})});
    var j=await r.json();if(!r.ok)throw new Error(r.status===400?"Wrong email or password.":(j.msg||j.message||"Could not sign in"));
    saveSes(j);f.reset();show(true);await load();
  }catch(x){er.textContent=errMsg(x)}finally{busy(false)}
});
$("#out").onclick=function(){saveSes(null);cars=[];show(false)};
document.addEventListener("keyup",function(e){if(e.key==="Escape")$("#ov").hidden=true});

(async function(){
  if(SES&&await (async function(){if(SES.expires_at&&SES.expires_at-Date.now()/1000<90)return refresh();return true})()){
    show(true);
    try{await load()}catch(x){toast(errMsg(x),true)}
  }else show(false);
})();
})();
</script>
</body>
</html>
